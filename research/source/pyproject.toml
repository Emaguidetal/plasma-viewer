[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rf-plasma-research"
version = "0.1.0"
description = "Reproducible benchmarks for laser-induced plasma in RF waveguides"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.14,<2",
  "matplotlib>=3.8,<4",
  "h5py>=3.13,<4",
  "numba>=0.60",
  "bolos>=0.1",
]

[project.scripts]
rf-plasma = "rf_plasma.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
